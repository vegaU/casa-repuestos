# Servidor web para la carpeta publica de Laravel.
server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    # Envía las rutas de Laravel al controlador frontal.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Entrega los scripts PHP al servicio PHP-FPM.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Impide el acceso a archivos ocultos sensibles.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
